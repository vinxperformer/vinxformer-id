name: CI

on:
  push:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  docs_checks:
    name: ID site checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run docs checks
        run: python3 scripts/check_docs_ci.py

  stm32:
    name: STM32 firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CMake
        run: python -m pip install cmake==3.26.4
      - name: Setup
        run: make setup_stm32
      - name: Build
        run: cmake --build build/stm32/release --parallel 2
